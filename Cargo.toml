[workspace.package]
version = "3.0.0-pre.2"
authors = ["Virto team <contact@virto.team>"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/virto-network/frame-contrib.git"

[workspace.dependencies]
codec = { package = "parity-scale-codec", version = "3.6.12", default-features = false, features = [
  "derive",
] }
impl-trait-for-tuples = { version = "0.2.3" }
log = { version = "0.4.27", default-features = false }
scale-info = { version = "2.11.6", default-features = false, features = [
  "derive",
] }
serde = { version = "1.0.219", default-features = false }
syn = { version = "2.0.100" }
quote = { version = "1.0.40" }
proc-macro-crate = { version = "3.3.0" }

# FRAME Contrib
frame-contrib-traits = { path = "./traits", version = "3.0.0-pre.2", default-features = false }
fc-traits-authn = { path = "./traits/authn", version = "3.0.0-pre.2", default-features = false }
fc-traits-authn-proc = { path = "./traits/authn/proc", version = "3.0.0-pre.2", default-features = false }
fc-traits-gas-tank = { path = "./traits/gas-tank", version = "3.0.0-pre.2", default-features = false }
fc-traits-listings = { path = "./traits/listings", version = "3.0.0-pre.2", default-features = false }
fc-traits-memberships = { path = "./traits/memberships", version = "3.0.0-pre.2", default-features = false }
fc-traits-nonfungibles-helpers = { path = "./traits/nonfungibles-helpers", version = "3.0.0-pre.2", default-features = false }
fc-traits-payments = { path = "./traits/payments", version = "3.0.0-pre.2", default-features = false }
fc-pallet-listings = { path = "./pallets/listings", version = "3.0.0-pre.2", default-features = false }
fc-pallet-payments = { path = "./pallets/payments", version = "3.0.0-pre.2", default-features = false }
fc-pallet-fees = { path = "./pallets/fees", version = "3.0.0-pre.2", default-features = false }
fc-pallet-referenda-tracks = { path = "./pallets/referenda-tracks", version = "3.0.0-pre.2", default-features = false }
fc-pallet-black-hole = { path = "./pallets/black-hole", version = "3.0.0-pre.2", default-features = false }
fc-pallet-communities = { path = "./pallets/communities", version = "3.0.0-pre.2", default-features = false }
fc-pallet-gas-transaction-payment = { path = "./pallets/gas-transaction-payment", version = "3.0.0-pre.2", default-features = false }
fc-pallet-orders = { path = "./pallets/orders", version = "3.0.0-pre.2", default-features = false }
fc-pallet-pass = { path = "./pallets/pass", version = "3.0.0-pre.2", default-features = false }

# Polkadot SDK
frame = { version = "0.19.0", package = "polkadot-sdk-frame", default-features = false, features = ["runtime"] }
frame-benchmarking = { version = "50.0.0", default-features = false }
frame-executive = { version = "49.0.0", default-features = false }
frame-support = { version = "49.0.0", default-features = false }
frame-system = { version = "49.0.0", default-features = false }
frame-system-rpc-runtime-api = { version = "44.0.0", default-features = false }
frame-try-runtime = { version = "0.55.0", default-features = false }
pallet-assets = { version = "54.0.0", default-features = false }
pallet-assets-holder = { version = "0.14.0", default-features = false }
pallet-assets-freezer = { version = "0.19.0", default-features = false }
pallet-babe = { version = "50.0.0", default-features = false }
pallet-balances = { version = "51.0.0", default-features = false }
pallet-nfts = { version = "44.0.0", default-features = false }
pallet-preimage = { version = "50.0.0", default-features = false }
pallet-referenda = { version = "50.0.0", default-features = false }
pallet-scheduler = { version = "51.0.0", default-features = false }
pallet-timestamp = { version = "49.0.0", default-features = false }
pallet-transaction-payment = { version = "50.0.0", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { version = "50.0.0", default-features = false }
serde_json = { version = "1.0.140", default-features = false }
sp-api = { version = "44.0.0", default-features = false }
sp-block-builder = { version = "44.0.0", default-features = false }
sp-core = { version = "43.0.0", default-features = false }
sp-genesis-builder = { version = "0.25.0", default-features = false }
sp-inherents = { version = "44.0.0", default-features = false }
sp-io = { version = "49.0.0", default-features = false }
sp-keyring = { version = "49.0.0", default-features = false }
sp-keystore = { version = "0.49.0", default-features = false }
sp-offchain = { version = "44.0.0", default-features = false }
sp-runtime = { version = "49.0.0", default-features = false }
sp-session = { version = "46.0.0", default-features = false }
sp-transaction-pool = { version = "44.0.0", default-features = false }
sp-version = { version = "47.0.0", default-features = false }
substrate-wasm-builder = { version = "35.0.0" }
xcm = { version = "25.0.0", package = "staging-xcm", default-features = false }

[workspace]
resolver = "2"
members = [
  "kitchensink",
  "mock-helpers",
  "pallets/*",
  "traits",
  "traits/authn",
  "traits/authn/proc",
  "traits/gas-tank",
  "traits/listings",
  "traits/memberships",
  "traits/nonfungibles-helpers",
  "traits/payments",
]
