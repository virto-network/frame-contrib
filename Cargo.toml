[workspace.package]
version = "2.3.0"
authors = ["Virto team <contact@virto.team>"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/virto-network/frame-contrib.git"

[workspace.dependencies]
codec = { package = "parity-scale-codec", version = "3.6.12", default-features = false, features = [
  "derive",
] }
impl-trait-for-tuples = { version = "0.2.3" }
log = { version = "0.4.27", default-features = false }
scale-info = { version = "2.11.6", default-features = false, features = [
  "derive",
] }
serde = { version = "1.0.219", default-features = false }
syn = { version = "2.0.100" }
quote = { version = "1.0.40" }
proc-macro-crate = { version = "3.3.0" }

# FRAME Contrib
frame-contrib-traits = { path = "./traits", version = "2.3.0", default-features = false }
fc-traits-authn = { path = "./traits/authn", version = "2.3.0", default-features = false }
fc-traits-authn-proc = { path = "./traits/authn/proc", version = "2.3.0", default-features = false }
fc-traits-gas-tank = { path = "./traits/gas-tank", version = "2.3.0", default-features = false }
fc-traits-listings = { path = "./traits/listings", version = "2.3.0", default-features = false }
fc-traits-memberships = { path = "./traits/memberships", version = "2.3.0", default-features = false }
fc-traits-nonfungibles-helpers = { path = "./traits/nonfungibles-helpers", version = "2.3.0", default-features = false }
fc-traits-payments = { path = "./traits/payments", version = "2.3.0", default-features = false }
fc-traits-tracks = { path = "./traits/tracks", version = "2.3.0", default-features = false }
fc-pallet-black-hole = { path = "./pallets/black-hole", version = "2.3.0", default-features = false }
fc-pallet-communities = { path = "./pallets/communities", version = "2.3.0", default-features = false }
fc-pallet-gas-transaction-payment = { path = "./pallets/gas-transaction-payment", version = "2.3.0", default-features = false }
fc-pallet-orders = { path = "./pallets/orders", version = "2.3.0", default-features = false }
fc-pallet-pass = { path = "./pallets/pass", version = "2.3.0", default-features = false }
fc-pallet-listings = { path = "./pallets/listings", version = "2.3.0", default-features = false }
fc-pallet-payments = { path = "./pallets/payments", version = "2.3.0", default-features = false }
fc-pallet-referenda-tracks = { path = "./pallets/referenda-tracks", version = "2.3.0", default-features = false }

# Polkadot SDK
frame = { version = "0.18.0", package = "polkadot-sdk-frame", default-features = false, features = ["runtime"] }
frame-benchmarking = { version = "49.0.0", default-features = false }
frame-executive = { version = "48.0.0", default-features = false }
frame-support = { version = "48.1.0", default-features = false }
frame-system = { version = "48.0.0", default-features = false }
frame-system-rpc-runtime-api = { version = "43.0.0", default-features = false }
frame-try-runtime = { version = "0.54.0", default-features = false }
pallet-assets = { version = "53.0.0", default-features = false }
pallet-assets-holder = { version = "0.13.0", default-features = false }
pallet-assets-freezer = { version = "0.18.0", default-features = false }
pallet-babe = { version = "49.0.0", default-features = false }
pallet-balances = { version = "50.0.0", default-features = false }
pallet-nfts = { version = "43.0.0", default-features = false }
pallet-preimage = { version = "49.0.0", default-features = false }
pallet-referenda = { version = "49.0.0", default-features = false }
pallet-scheduler = { version = "50.0.0", default-features = false }
pallet-timestamp = { version = "48.0.0", default-features = false }
pallet-transaction-payment = { version = "49.0.0", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { version = "49.0.0", default-features = false }
serde_json = { version = "1.0.140", default-features = false }
sp-api = { version = "43.0.0", default-features = false }
sp-block-builder = { version = "43.0.0", default-features = false }
sp-core = { version = "43.0.0", default-features = false }
sp-genesis-builder = { version = "0.24.0", default-features = false }
sp-inherents = { version = "43.0.0", default-features = false }
sp-io = { version = "48.0.0", default-features = false }
sp-keyring = { version = "48.0.0", default-features = false }
sp-keystore = { version = "0.49.0", default-features = false }
sp-offchain = { version = "43.0.0", default-features = false }
sp-runtime = { version = "48.0.0", default-features = false }
sp-session = { version = "45.0.0", default-features = false }
sp-transaction-pool = { version = "43.0.0", default-features = false }
sp-version = { version = "46.0.0", default-features = false }
substrate-wasm-builder = { version = "34.0.1" }
xcm = { version = "24.1.0", package = "staging-xcm", default-features = false }

[workspace]
resolver = "2"
members = [
  "kitchensink",
  "mock-helpers",
  "pallets/*",
  "traits",
  "traits/authn",
  "traits/authn/proc",
  "traits/gas-tank",
  "traits/listings",
  "traits/memberships",
  "traits/nonfungibles-helpers",
  "traits/payments",
  "traits/tracks",
]
