# Proves the real-verifier test fixture of `fc-pallet-spaces` with VOS's own prover.
#
# Native only, with `vos-pvm-proof`'s `prover` feature on: its own workspace, so that feature and
# VOS's nightly toolchain never reach frame-contrib's workspace. See `../README.md`.
[package]
name = "fc-spaces-fixture-gen"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[workspace]

[dependencies]
vos-pvm-proof = { git = "https://codeberg.org/Virto/VOS", rev = "2bb78760df07a47aaa92b1fb74998815195ebab7" }
vos-pvm-proof-verifier = { git = "https://codeberg.org/Virto/VOS", rev = "2bb78760df07a47aaa92b1fb74998815195ebab7" }
vos-pvm = { git = "https://codeberg.org/Virto/VOS", rev = "2bb78760df07a47aaa92b1fb74998815195ebab7" }
postcard = { version = "1", features = ["alloc"] }
blake2b_simd = "1"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
