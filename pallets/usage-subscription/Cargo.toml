[package]
authors.workspace = true
description = "Usage subscriptions: a group buys a recurring, shared allowance of weight for its members, whose transaction fees are waived while it covers them."
edition.workspace = true
license.workspace = true
name = "fc-pallet-usage-subscription"
repository.workspace = true
readme = "README.md"
version.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec.workspace = true
scale-info.workspace = true
fc-traits-listings.workspace = true
fc-traits-memberships.workspace = true
frame-benchmarking = { workspace = true, optional = true }
frame-support.workspace = true
frame-system.workspace = true
sp-runtime.workspace = true

[dev-dependencies]
fc-pallet-listings.workspace = true
fc-pallet-payments.workspace = true
mock-helpers = { package = "fc-mock-helpers", path = "../../mock-helpers", default-features = false, features = ["pallet-assets", "pallet-balances"] }
pallet-assets.workspace = true
pallet-assets-holder.workspace = true
pallet-balances.workspace = true
pallet-nfts.workspace = true
pallet-scheduler.workspace = true
pallet-transaction-payment.workspace = true
sp-core.workspace = true
sp-io.workspace = true

[features]
default = ["std"]
runtime-benchmarks = [
  "fc-pallet-listings/runtime-benchmarks",
  "fc-pallet-payments/runtime-benchmarks",
  "frame-benchmarking/runtime-benchmarks",
  "frame-support/runtime-benchmarks",
  "frame-system/runtime-benchmarks",
  "pallet-assets/runtime-benchmarks",
  "pallet-assets-holder/runtime-benchmarks",
  "pallet-balances/runtime-benchmarks",
  "pallet-nfts/runtime-benchmarks",
  "pallet-scheduler/runtime-benchmarks",
  "pallet-transaction-payment/runtime-benchmarks",
  "sp-runtime/runtime-benchmarks",
]
std = [
  "codec/std",
  "fc-pallet-listings/std",
  "fc-pallet-payments/std",
  "fc-traits-listings/std",
  "fc-traits-memberships/std",
  "frame-benchmarking?/std",
  "frame-support/std",
  "frame-system/std",
  "mock-helpers/std",
  "pallet-assets/std",
  "pallet-assets-holder/std",
  "pallet-balances/std",
  "pallet-nfts/std",
  "pallet-scheduler/std",
  "pallet-transaction-payment/std",
  "scale-info/std",
  "sp-core/std",
  "sp-io/std",
  "sp-runtime/std",
]
try-runtime = [
  "fc-pallet-listings/try-runtime",
  "fc-pallet-payments/try-runtime",
  "frame-support/try-runtime",
  "frame-system/try-runtime",
  "pallet-assets/try-runtime",
  "pallet-assets-holder/try-runtime",
  "pallet-balances/try-runtime",
  "pallet-nfts/try-runtime",
  "pallet-scheduler/try-runtime",
  "pallet-transaction-payment/try-runtime",
  "sp-runtime/try-runtime",
]
