# git-cliff configuration: renders one section of CHANGELOG.md per release.
#
# Used by .github/workflows/release-plz.yml to write the next version's section
# into the release PR. It covers every commit on `main` since the last `vX.Y.Z`
# tag, grouped by conventional-commit type, with breaking changes (`!`) listed
# first. See CONTRIBUTING.md.
#
# Preview locally: git cliff --unreleased --tag vX.Y.Z --strip all

[changelog]
header = ""
body = """
{%- macro entry(commit) -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/virto-network/frame-contrib/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
{% set breaking = commits | filter(attribute="breaking", value=true) %}
{%- if breaking | length > 0 %}
### ⚠ Breaking changes
{% for commit in breaking %}
{{ self::entry(commit=commit) }}
{%- endfor %}
{% endif %}
{%- for group, group_commits in commits | filter(attribute="breaking", value=false) | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in group_commits %}
{{ self::entry(commit=commit) }}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Keep non-conventional titles (listed under "Other") instead of dropping them.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
# Only release tags. The moving `polkadot-stableYYMM` tags are not releases.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "newest"
commit_preprocessors = [
  # Squash merges end in "(#123)": turn it into a PR link.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/virto-network/frame-contrib/pull/${1}))" },
]
# The `<!-- N -->` prefixes only fix the group order; they are stripped when rendering.
commit_parsers = [
  { message = "^chore: release v", skip = true },
  # Written by the release workflow itself.
  { message = "^docs\\(changelog\\)", skip = true },
  { message = "^(ci|test|style)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^revert", group = "<!-- 4 -->Reverted" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = ".*", group = "<!-- 6 -->Other" },
]
