name: Lint, check, clippy and test

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check every crate is released in lockstep
        run: |
          missing="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' \
            | while read -r name; do grep -qx "name = \"$name\"" release-plz.toml || echo "$name"; done)"
          if [ -n "$missing" ]; then
            echo "::error file=release-plz.toml::Missing from release-plz.toml (see CONTRIBUTING.md#adding-a-crate): $(echo $missing)"
            exit 1
          fi

  check:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Setup Ubuntu dependencies
        shell: bash
        run: sudo apt update && sudo apt install -y protobuf-compiler

      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.7.3
        with:
          cache-on-failure: true
          cache-all-crates: true
          key: check

      - name: Check Build
        run: |
          cargo check --release --locked --all-features --workspace

  clippy:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      checks: write
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - name: Setup Ubuntu dependencies
        shell: bash
        run: sudo apt update && sudo apt install -y protobuf-compiler

      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.7.3
        with:
          cache-on-failure: true
          cache-all-crates: true
          key: check

      - name: Annotate with Clippy warnings
        uses: actions-rs/clippy-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --release --locked --all-features --workspace

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Setup Ubuntu dependencies
        shell: bash
        run: sudo apt update && sudo apt install -y protobuf-compiler

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: wasm32v1-none
          components: rust-src

      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.7.3
        with:
          cache-on-failure: true
          cache-all-crates: true
          key: test

      - name: Run tests
        run: cargo test --release --locked --all-features --workspace
