name: Lint, check, clippy and test

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check every crate is released in lockstep
        run: |
          missing="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' \
            | while read -r name; do grep -qx "name = \"$name\"" release-plz.toml || echo "$name"; done)"
          if [ -n "$missing" ]; then
            echo "::error file=release-plz.toml::Missing from release-plz.toml (see CONTRIBUTING.md#adding-a-crate): $(echo $missing)"
            exit 1
          fi

  check:
    needs: lint
    runs-on: ubuntu-latest
    env:
      # The kitchensink runtime's WASM blob is built by the `kitchensink` job.
      SKIP_WASM_BUILD: 1
    steps:
      - name: Setup Ubuntu dependencies
        shell: bash
        run: sudo apt update && sudo apt install -y protobuf-compiler

      - uses: actions/checkout@v5

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
          key: check

      - name: Check Build
        run: |
          cargo check --release --locked --all-features --workspace

  clippy:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      checks: write
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - name: Setup Ubuntu dependencies
        shell: bash
        run: sudo apt update && sudo apt install -y protobuf-compiler

      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          # Swatinem/rust-cache below already caches, and warnings must stay warnings.
          cache: false
          rustflags: ""

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
          key: check

      # The toolchain action registers problem matchers, so warnings still show up as
      # annotations on the PR.
      - name: Annotate with Clippy warnings
        run: cargo clippy --release --locked --all-features --workspace

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      # The kitchensink runtime's WASM blob is built by the `kitchensink` job.
      SKIP_WASM_BUILD: 1
    steps:
      - name: Setup Ubuntu dependencies
        shell: bash
        run: sudo apt update && sudo apt install -y protobuf-compiler

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32v1-none
          components: rust-src
          cache: false
          rustflags: ""

      - uses: actions/checkout@v5

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
          key: test

      - name: Run tests
        run: cargo test --release --locked --all-features --workspace

  kitchensink:
    needs: lint
    runs-on: ubuntu-latest
    env:
      # Recent `rustc`s no longer turn undefined symbols into imports when linking for
      # `wasm32v1-none`, but a runtime imports its host functions from the host.
      WASM_BUILD_RUSTFLAGS: "-C link-arg=--allow-undefined"
    steps:
      - name: Setup Ubuntu dependencies
        shell: bash
        run: sudo apt update && sudo apt install -y protobuf-compiler

      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
          key: kitchensink

      - name: Build the kitchensink runtime with benchmarks
        run: cargo build --release --locked -p fc-kitchensink-runtime --features runtime-benchmarks

      - name: Install frame-omni-bencher
        run: |
          release="polkadot-$(cat polkadot-sdk-version)"
          base="https://github.com/paritytech/polkadot-sdk/releases/download/$release"
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSL --retry 5 -O "$base/frame-omni-bencher" -O "$base/frame-omni-bencher.sha256"
          sha256sum -c frame-omni-bencher.sha256
          chmod +x frame-omni-bencher
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run every benchmark once
        run: |
          frame-omni-bencher v1 benchmark pallet --all --steps 2 --repeat 1 \
            --runtime target/release/wbuild/fc-kitchensink-runtime/fc_kitchensink_runtime.compact.compressed.wasm
