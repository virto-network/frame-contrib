name: Release

# Lockstep releases driven by release-plz (see RELEASING.md and release-plz.toml).
#
# - `release-pr` keeps a "chore: release vX.Y.Z" PR open with the next version,
#   then writes that version's CHANGELOG.md section onto it with git-cliff
#   (cliff.toml). Merging the PR is how a release is cut.
# - `release` runs after that PR lands. It publishes every crate to crates.io,
#   pushes the `vX.Y.Z` tag, creates the GitHub release from the CHANGELOG.md
#   section, and moves the `polkadot-stableYYMM` tag to the released commit.
#
# Required setup:
# - secret `CARGO_REGISTRY_TOKEN`: crates.io token with publish-new and publish-update scopes.
# - `CRATES_IO_PUBLISH=true`, as a repository variable or secret: enables publishing. Until it is set,
#   only the release PR is maintained.
# - (recommended) the org's GitHub App: variable `KREIVOPS_APP_ID` and secret
#   `KREIVOPS_APP_PRIVATE_KEY`. PRs opened and commits pushed with the default
#   GITHUB_TOKEN don't trigger CI, so the release PR would never get its checks.
#   A `RELEASE_PLZ_TOKEN` PAT secret still works as a fallback.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_semver_check:
        description: >-
          Compute the version bump from the commit titles alone, without
          cargo-semver-checks. Use it for a release whose only Rust API change
          is runtime-configuration rework (a new `Config` associated type, a
          `WeightInfo` signature), which is not client-visible and so is not a
          breaking change here. See RELEASING.md.
        type: boolean
        default: false

jobs:
  release:
    name: Publish release
    if: github.repository_owner == 'virto-network'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `CRATES_IO_PUBLISH` may be set as a repository variable or as a secret. A job-level
      # `if` can't read secrets, so the gate is a step.
      - name: Check that publishing is enabled
        id: gate
        env:
          FROM_VARIABLE: ${{ vars.CRATES_IO_PUBLISH }}
          FROM_SECRET: ${{ secrets.CRATES_IO_PUBLISH }}
        run: |
          if [ "$FROM_VARIABLE" = "true" ] || [ "$FROM_SECRET" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Publishing is off: set CRATES_IO_PUBLISH=true (variable or secret) to enable it." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mint GitHub App token
        id: app-token
        if: ${{ vars.KREIVOPS_APP_ID != '' && steps.gate.outputs.enabled == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.KREIVOPS_APP_ID }}
          private-key: ${{ secrets.KREIVOPS_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Ubuntu dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: sudo apt update && sudo apt install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.enabled == 'true'

      # `semver_check` lives in release-plz.toml, and cargo-semver-checks raises the bump
      # whenever the Rust API changed, whatever the commit titles said. A Config/WeightInfo
      # rework trips it without being client-visible, so this run can opt out by using a
      # patched copy of the config. The committed file is never touched.
      - name: Resolve the release-plz config
        id: cfg
        if: steps.gate.outputs.enabled == 'true'
        env:
          SKIP_SEMVER_CHECK: ${{ inputs.skip_semver_check }}
        run: |
          config=release-plz.toml
          if [ "$SKIP_SEMVER_CHECK" = "true" ]; then
            config="$RUNNER_TEMP/release-plz.no-semver-check.toml"
            sed 's/^semver_check = true$/semver_check = false/' release-plz.toml > "$config"
            grep -q '^semver_check = false$' "$config" || {
              echo "release-plz.toml no longer has 'semver_check = true'; update this step." >&2
              exit 1
            }
            echo "cargo-semver-checks is off for this run: the bump comes from the commit titles." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "path=$config" >> "$GITHUB_OUTPUT"

      - name: Run release-plz
        id: release
        if: steps.gate.outputs.enabled == 'true'
        uses: release-plz/action@v0.5
        with:
          command: release
          config: ${{ steps.cfg.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub release
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          version="$(jq -r '.[0].version' <<< "$RELEASES")"
          # The body of `## [X.Y.Z]` up to the next `## [` heading, as curated in the release PR.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[^]]+\]: https?:\/\// { print }
          ' CHANGELOG.md > release-notes.md
          # Keep the reference-style links used by the section.
          grep -E '^\[[^]]+\]: https?://' CHANGELOG.md >> release-notes.md || true
          gh release create "v$version" --title "v$version" --notes-file release-notes.md --verify-tag

      - name: Move Polkadot SDK tag
        if: steps.release.outputs.releases_created == 'true'
        run: |
          sdk="$(tr -d '[:space:]' < polkadot-sdk-version)"
          tag="polkadot-${sdk%%-*}"
          git tag -f "$tag"
          git push -f origin "refs/tags/$tag"
          echo "Moved \`$tag\` to $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  release-pr:
    name: Update release PR
    if: github.repository_owner == 'virto-network'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Mint GitHub App token
        id: app-token
        if: ${{ vars.KREIVOPS_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.KREIVOPS_APP_ID }}
          private-key: ${{ secrets.KREIVOPS_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Ubuntu dependencies
        run: sudo apt update && sudo apt install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      # `semver_check` lives in release-plz.toml, and cargo-semver-checks raises the bump
      # whenever the Rust API changed, whatever the commit titles said. A Config/WeightInfo
      # rework trips it without being client-visible, so this run can opt out by using a
      # patched copy of the config. The committed file is never touched.
      - name: Resolve the release-plz config
        id: cfg
        env:
          SKIP_SEMVER_CHECK: ${{ inputs.skip_semver_check }}
        run: |
          config=release-plz.toml
          if [ "$SKIP_SEMVER_CHECK" = "true" ]; then
            config="$RUNNER_TEMP/release-plz.no-semver-check.toml"
            sed 's/^semver_check = true$/semver_check = false/' release-plz.toml > "$config"
            grep -q '^semver_check = false$' "$config" || {
              echo "release-plz.toml no longer has 'semver_check = true'; update this step." >&2
              exit 1
            }
            echo "cargo-semver-checks is off for this run: the bump comes from the commit titles." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "path=$config" >> "$GITHUB_OUTPUT"

      - name: Run release-plz
        id: release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          config: ${{ steps.cfg.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Write changelog section
        env:
          PR: ${{ steps.release-pr.outputs.pr }}
        run: |
          pr="${PR:-}"
          [ -n "$pr" ] || pr='{}'
          branch="$(jq -r '.head_branch // empty' <<< "$pr")"
          version="$(jq -r '.releases[0].version // empty' <<< "$pr")"
          if [ -z "$branch" ] || [ -z "$version" ]; then
            echo "No release PR open; nothing to do."
            exit 0
          fi

          git fetch origin "$branch"
          git switch "$branch"

          # A section already on the branch that the bot didn't write was curated
          # by a maintainer (e.g. the hand-written first release): keep it.
          if grep -q "^## \[$version\]" CHANGELOG.md \
            && [ "$(git log -1 --format=%an -- CHANGELOG.md)" != "github-actions[bot]" ]; then
            echo "CHANGELOG.md already has a curated $version section; leaving it."
            exit 0
          fi

          # Drop any stale bot-written section for this version, then insert the
          # regenerated one right after `## [Unreleased]`.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { skip = 1; next }
            skip && /^## \[/ { skip = 0 }
            !skip { print }
          ' CHANGELOG.md > CHANGELOG.tmp
          git cliff --unreleased --tag "v$version" --strip all > section.md
          awk '
            { print }
            /^## \[Unreleased\]/ && !done { print ""; while ((getline line < "section.md") > 0) print line; done = 1 }
          ' CHANGELOG.tmp > CHANGELOG.md
          rm CHANGELOG.tmp section.md

          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "docs(changelog): v$version" -- CHANGELOG.md
          git push origin "$branch"
