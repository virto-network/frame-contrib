name: Release

# Lockstep releases driven by release-plz (see RELEASING.md and release-plz.toml).
#
# - `release-pr` keeps a "chore: release vX.Y.Z" PR open with the next version and
#   changelog. Merging it is how a release is cut.
# - `release` runs after that PR lands: it publishes every crate to crates.io,
#   pushes the `vX.Y.Z` tag and GitHub release, and moves the
#   `polkadot-stableYYMM` tag to the released commit.
#
# Required setup:
# - secret `CARGO_REGISTRY_TOKEN`: crates.io token with publish-new and publish-update scopes.
# - variable `CRATES_IO_PUBLISH=true`: enables the `release` job. Until it is set,
#   only the release PR is maintained.
# - (recommended) secret `RELEASE_PLZ_TOKEN`: a PAT or GitHub App token. PRs opened
#   with the default GITHUB_TOKEN don't trigger CI, so the release PR would never
#   get its checks.

on:
  push:
    branches: [main]

jobs:
  release:
    name: Publish release
    if: github.repository_owner == 'virto-network' && vars.CRATES_IO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Ubuntu dependencies
        run: sudo apt update && sudo apt install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Move Polkadot SDK tag
        if: steps.release.outputs.releases_created == 'true'
        run: |
          sdk="$(tr -d '[:space:]' < polkadot-sdk-version)"
          tag="polkadot-${sdk%%-*}"
          git tag -f "$tag"
          git push -f origin "refs/tags/$tag"
          echo "Moved \`$tag\` to $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  release-pr:
    name: Update release PR
    if: github.repository_owner == 'virto-network'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Ubuntu dependencies
        run: sudo apt update && sudo apt install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
