# release-plz configuration — see RELEASING.md.
#
# All crates are released in lockstep: they share one version (`version_group`),
# one changelog (./CHANGELOG.md) and one `vX.Y.Z` tag, created on the
# `frame-contrib-traits` entry below. The version is bumped from the conventional
# commit titles on `main`, with cargo-semver-checks as a safety net:
#
#   feat!: / fix!: / `BREAKING CHANGE:` footer -> major
#   feat:                                       -> minor
#   anything else                               -> patch
#
# New Polkadot SDK `stableYYMM` releases always land as `feat(deps)!:` (see
# .github/workflows/sdk-upgrade.yml), so every SDK bump is a major release.

[workspace]
changelog_update = false
git_release_enable = false
git_tag_enable = false
semver_check = true
pr_name = "chore: release v{{ version }}"
pr_labels = ["release"]

[[package]]
name = "fc-mock-helpers"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-black-hole"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-communities"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-fees"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-gas-transaction-payment"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-listings"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-orders"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-pass"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-payments"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-referenda-tracks"
version_group = "frame-contrib"

[[package]]
name = "frame-contrib-traits"
version_group = "frame-contrib"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = ["fc-mock-helpers", "fc-pallet-black-hole", "fc-pallet-communities", "fc-pallet-fees", "fc-pallet-gas-transaction-payment", "fc-pallet-listings", "fc-pallet-orders", "fc-pallet-pass", "fc-pallet-payments", "fc-pallet-referenda-tracks", "fc-traits-authn", "fc-traits-authn-proc", "fc-traits-gas-tank", "fc-traits-listings", "fc-traits-memberships", "fc-traits-nonfungibles-helpers", "fc-traits-payments"]
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"

[[package]]
name = "fc-traits-authn"
version_group = "frame-contrib"

[[package]]
name = "fc-traits-authn-proc"
version_group = "frame-contrib"

[[package]]
name = "fc-traits-gas-tank"
version_group = "frame-contrib"

[[package]]
name = "fc-traits-listings"
version_group = "frame-contrib"

[[package]]
