# release-plz configuration — see RELEASING.md.
#
# All crates are released in lockstep: they share one version (`version_group`)
# and one `vX.Y.Z` tag, created on the `frame-contrib-traits` entry below.
#
# release-plz does not write the changelog. Its per-package commit filtering
# drops cross-crate changes, so ./CHANGELOG.md is written by git-cliff
# (cliff.toml) in the release workflow, and the GitHub release is created from
# that curated section. The version is bumped from the conventional
# commit titles on `main`, with cargo-semver-checks as a safety net:
#
#   feat!: / fix!: / `BREAKING CHANGE:` footer -> major
#   feat:                                       -> minor
#   anything else                               -> patch
#
# New Polkadot SDK `stableYYMM` releases always land as `feat(deps)!:` (see
# .github/workflows/sdk-upgrade.yml), so every SDK bump is a major release.

[workspace]
changelog_update = false
git_release_enable = false
git_tag_enable = false
semver_check = true
pr_name = "chore: release v{{ version }}"
pr_labels = ["release"]

[[package]]
name = "fc-mock-helpers"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-black-hole"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-communities"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-fees"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-gas-transaction-payment"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-listings"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-orders"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-pass"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-payments"
version_group = "frame-contrib"

[[package]]
