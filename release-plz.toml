version_group = "frame-contrib"

[[package]]
name = "fc-traits-nonfungibles-helpers"
version_group = "frame-contrib"

[[package]]
name = "fc-traits-payments"
version_group = "frame-contrib"

[[package]]
name = "fc-pallet-template"
release = false
